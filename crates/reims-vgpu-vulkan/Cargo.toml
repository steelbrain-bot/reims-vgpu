[package]
name = "reims-vgpu-vulkan"
version = "0.1.0"
edition = "2021"
description = "Vulkan capability and execution policy for Reims vGPU"
license = "GPL-2.0-or-later"

[lib]
name = "reims_vgpu_vulkan"

[features]
test-fixtures = []
host-window = ["dep:ash-window", "dep:raw-window-handle"]

[dependencies]
ash = "0.38"
ash-window = { version = "0.13", optional = true }
metal2vulkan = { git = "https://github.com/steelbrain/metal2vulkan.git", rev = "9ff250502cd7ae8c6e0fab0b373b88d254d46170" }
once_cell = "1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
raw-window-handle = { version = "0.6", optional = true }
reims-vgpu-config = { path = "../reims-vgpu-config" }
reims-vgpu-core = { path = "../reims-vgpu-core" }
reims-vgpu-memory = { path = "../reims-vgpu-memory" }
reims-vgpu-observe = { path = "../reims-vgpu-observe" }
reims-vgpu-paging = { path = "../reims-vgpu-paging" }
reims-vgpu-protocol = { path = "../reims-vgpu-protocol" }
reims-vgpu-wire = { path = "../reims-vgpu-wire" }
spirv = "0.4"

[dev-dependencies]
reims-vgpu-testkit = { path = "../reims-vgpu-testkit" }
# `cfg(test)` does not reach a dependency, so the always-on sinks stay pointed at
# the live product log unless this crate asks for the per-process test paths.
# A test run and a boot share one machine here; see `reims-vgpu-observe::sink`.
reims-vgpu-observe = { path = "../reims-vgpu-observe", features = ["test-fixtures"] }
